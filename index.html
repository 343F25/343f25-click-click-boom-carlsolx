  <audio id="boom" src="350975__cabled_mess__boom_c_02.wav"></audio>
  <script>
    let clickCount = 0;
    const clickSound = document.getElementById('click')
    const boomSound = document.getElementById('boom')
    let lastSound = clickSound;

    const cells = document.querySelectorAll('td');
    cells.forEach(cell => {
      cell.addEventListener('click', onClick);
    })

    const h1 = document.querySelector('h1');

    function onClick(ev) {
      lastSound.pause()
      lastSound.currentTime = 0;
      clickCount++
      if (clickCount % 3 == 0) {
        // boom
        boomSound.play();
        lastSound = boomSound;

        if (h1.textContent == "BOOM") {
          h1.textContent = "";
        } else {
          h1.textContent = "BOOM";
        }

      } else {
        clickSound.play();
        lastSound = clickSound
      }

      ev.target.parentElement.classList.toggle('odd');
      console.log(`ev in onClick`, ev)
      ev.target.remove();
    }
  </script>
